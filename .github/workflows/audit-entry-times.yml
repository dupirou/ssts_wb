name: Audit official entry-time fields
on:
  push:
    branches: [fix/entry-time-seeding-20261022]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Inspect official distance entry fields
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import sync_predictions as s, stations
          cfg=stations.sources(next(x for x in stations.stations() if x['id']=='vancouver'))
          events=s.discover_events(s.sync.fetch(cfg['prediction']['entries_url']),cfg)
          output={}
          for key,event in events.items():
              rows=s.response(s.sync.fetch(s.API+'/events/get-event-result-entrylist-single',dict(event_result_id=event['event_result_id'],event_id=cfg['prediction']['event_id'],country_code='')),'entries')['data']
              items=[]
              for row in rows:
                  skater=row.get('skaters') or {}
                  items.append(dict(name=skater.get('full_name'),skaters_id=row.get('skaters_id'),country=row.get('started_for_nf_code'),fields={k:v for k,v in row.items() if k!='skaters'},skater_keys=list(skater),skater_times={k:v for k,v in skater.items() if any(t in k.lower() for t in ('time','best','rank'))}))
              output[f'{key[0]}-{key[1]}']=items
              print(key,'count',len(rows),'keys',list(rows[0]),flush=True)
              print('CHN',[x for x in items if x['country']=='CHN'],flush=True)
          Path('entry-time-audit.json').write_text(json.dumps(output,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Refresh and validate corrected forecasts
        run: |
          python tools/sync_predictions.py --event vancouver
          python tools/build.py
          python -m unittest discover -s tests -v
      - name: Save source audit for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entry-time-audit.json data/prediction_inputs dist
          if ! git diff --cached --quiet; then
            git commit -m 'test: capture public official entry-time fields'
            git push origin HEAD:fix/entry-time-seeding-20261022
          fi
