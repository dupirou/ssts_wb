name: One-shot regenerate tracked assets on reliability branch
on:
  push:
    branches: [refactor/reliability-observability-20261028]
    paths: [.github/workflows/one-shot-dist.yml]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/refactor/reliability-observability-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt ruff==0.16.9
      - run: bash tools/ci_run.sh build
      - run: bash tools/ci_run.sh test
      - name: Commit regenerated tracked products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist data/updates.json
          if git diff --cached --quiet; then
            echo "Generated assets already match HEAD"
            exit 0
          fi
          git commit -m "build: regenerate tracked assets and security headers"
          git push origin HEAD:refactor/reliability-observability-20261028
