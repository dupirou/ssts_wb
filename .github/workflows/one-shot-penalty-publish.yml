name: One-shot seed verified Vancouver penalties and dist
on:
  push:
    branches: [feature/official-penalty-codes-20261028]
    paths: ['.github/workflows/one-shot-penalty-publish.yml']
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt ruff==0.16.9
      - run: python tools/sync_penalties.py --event vancouver
      - run: ruff format tools/penalty_protocol.py tools/sync_penalties.py tests/test_penalty_protocol.py
      - run: npm ci --ignore-scripts && npm run format
      - run: bash tools/ci_run.sh build
      - name: Verify all tests (retry once for known asynchronous Node test flake)
        run: |
          if ! bash tools/ci_run.sh test; then
            echo 'Initial test run failed; rerun the full suite once to diagnose a known asynchronous Node fixture race'
            bash tools/ci_run.sh test
          fi
      - name: Commit only verified data, generated assets, and formatter edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/penalties/vancouver.json data/competitions/vancouver.json dist tools/penalty_protocol.py tools/sync_penalties.py tests/test_penalty_protocol.py web/app.js web/portal.js web/site.css
          if ! git diff --cached --quiet; then
            git commit -m 'build: verify Vancouver cumulative penalties and referee codes'
            git push origin HEAD:feature/official-penalty-codes-20261028
          fi
