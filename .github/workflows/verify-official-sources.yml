name: Verify official entry and draw sources
on:
  push:
    branches: [fix/official-entries-draw-20261023]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Read public official sources
        run: |
          python - <<'PY'
          import sys,json,zlib,base64
          sys.path.insert(0,'tools')
          import sync_competitions as sync, isu_results,stations
          from bs4 import BeautifulSoup
          cfg=stations.sources(stations.get('vancouver'))
          raw=sync.fetch(cfg['results_url']); soup=BeautifulSoup(raw,'html.parser')
          print('OFFICIAL_LINKS',[(a.get_text(' ',strip=True),a['href']) for a in soup.select('a[href]') if any(t in a['href'].lower() for t in ['swisstiming','sportresult','.pdf'])])
          events=isu_results.embedded_results(raw)
          print('EVENT_METADATA',json.dumps(events))
          for e in events:
           b=sync.fetch(isu_results.API+'/events/get-event-result-round',dict(event_result_id=e['event_result_id']))
           print('ROUND_METADATA',e['name'],b.decode())
          PY
