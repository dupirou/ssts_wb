name: One-shot inspect official Vancouver penalty pages
on:
  push:
    branches: [feature/official-penalty-codes-20261028]
    paths: ['.github/workflows/one-shot-penalty-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python -m pip install pypdf==6.1.3
      - name: Fetch and identify official Protocol tables
        env:
          DOCUMENT: 'https://isu-d8g8b4b7ece7aphs.a03.azurefd.net/isudamcontainer/uploads/isunewrevamp/document/original/f287f824479994deccf3aa5b8feffb7cf74f956138eef0e11eda96ad535b31c9.pdf'
        run: |
          python - <<'PY'
          import io, os, re
          from urllib.request import Request, urlopen
          from pypdf import PdfReader
          req = Request(os.environ['DOCUMENT'], headers={'User-Agent': 'SSTS-WB/1.0'})
          with urlopen(req, timeout=60) as response:
              raw = response.read(20_000_001)
          if len(raw) > 20_000_000 or not raw.startswith(b'%PDF-'):
              raise RuntimeError('Unexpected official PDF body')
          pdf = PdfReader(io.BytesIO(raw))
          print('OFFICIAL_PAGES:', len(pdf.pages), 'BYTES:', len(raw))
          selections = []
          for i, page in enumerate(pdf.pages):
              t = page.extract_text(extraction_mode='layout') or ''
              clean = t.upper()
              if any(k in clean for k in ('INFRINGEMENT REPORT','CUMULATIVE PENALTY','ACCUMULATED SANCTION','SANCTIONS SUMMARY','INFRINGEMENTS')):
                  selections.append((i,t))
          print('MATCHED_PAGES:', [i+1 for i,_ in selections])
          for i,t in selections[:18]:
              print('===== PAGE',i+1,'=====')
              lines=t.splitlines()
              for j,l in enumerate(lines):
                  if any(k in l.upper() for k in ('INFRINGEMENT','CUMULATIVE','SANCTION','REFEREE DECISION','PENALTIES','PENALTY LIST')):
                      print('HEADER_LINE',j,repr(l[:150]))
              for j,l in enumerate(lines[:80]):
                  print(f'{j:02}:',l[:180])
          print('LAST_PAGE_TITLES:')
          for i in range(max(0,len(pdf.pages)-12),len(pdf.pages)):
              t=pdf.pages[i].extract_text(extraction_mode='layout') or ''
              print(i+1, ' | '.join(x.strip() for x in t.splitlines() if x.strip())[:180])
          PY
