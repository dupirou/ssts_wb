name: Build and safely sync ISU schedule
on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ssts-wb-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser
        run: python -m pip install -r requirements.txt
      - name: Check official schedule, preserve known-good data on failure
        continue-on-error: true
        run: python tools/sync_schedule.py && touch .sync_ok
      - name: Collect confirmed China heats from published ISU results
        continue-on-error: true
        run: python tools/sync_china.py && touch .china_sync_ok
      - name: Sync entries, official groups, results and penalties
        continue-on-error: true
        run: python tools/sync_competitions.py
      - name: Sync confirmed distance entries and historical seed sources
        continue-on-error: true
        run: python tools/sync_predictions.py
      - name: Compile static site
        run: python tools/build.py
      - name: Test
        run: |
          npm ci --ignore-scripts
          python -m unittest discover -s tests -v
          node --check web/app.js
          node --test tests/test_api.mjs
          node --test tests/test_athlete_ui.mjs
      - name: Commit built site and accepted official updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git add data/competitions data/prediction_inputs
          if [ -f .china_sync_ok ]; then git add data/china_auto.json; fi
          if [ -f .sync_ok ]; then
            git add data/vancouver.csv data/sync_meta.json
          else
            echo "::warning::ISU programme verification failed; retaining prior verified data."
          fi
          if ! git diff --cached --quiet; then
            git commit -m "build: publish verified static schedule"
            git push
          fi
