name: Build and safely sync ISU schedule
run-name: ISU sync (${{ inputs.sync_decision || 'periodic' }})
on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
    inputs:
      sync_decision:
        description: "Cloudflare Cron dispatch window; manual calls omit this"
        type: choice
        options: [manual, hourly, session]
        default: manual
permissions:
  contents: write
  actions: read
  issues: write
concurrency:
  group: ssts-wb-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install parser
        run: python -m pip install -r requirements.txt ruff==0.16.9
      # Each sync writes only data it has fully validated; a rejected station keeps its last verified data.
      - name: Find stations' ISU pages and check their official programmes
        id: sync_schedule
        continue-on-error: true
        run: bash tools/ci_run.sh schedule
      - name: Sync entries, official groups, results and penalties
        id: sync_competitions
        continue-on-error: true
        run: bash tools/ci_run.sh competitions
      - name: Collect confirmed China heats from published ISU results
        id: sync_china
        continue-on-error: true
        run: bash tools/ci_run.sh china
      - name: Sync confirmed distance entries and historical seed sources
        id: sync_predictions
        continue-on-error: true
        run: bash tools/ci_run.sh predictions
      - name: Summarize each sync outcome
        if: always()
        env:
          SCHEDULE: ${{ steps.sync_schedule.outcome }}
          CHINA: ${{ steps.sync_china.outcome }}
          COMPETITIONS: ${{ steps.sync_competitions.outcome }}
          PREDICTIONS: ${{ steps.sync_predictions.outcome }}
        run: |
          {
            echo '## ISU sync outcomes'
            echo '| Step | Outcome |'
            echo '| --- | --- |'
            printf '| schedule | %s |\\n' "$SCHEDULE"
            printf '| china | %s |\\n' "$CHINA"
            printf '| competitions | %s |\\n' "$COMPETITIONS"
            printf '| predictions | %s |\\n' "$PREDICTIONS"
            echo 'Safe validation refusals exit 0 and appear as warnings in the step log; unexpected failures exit nonzero.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile static site
        id: build_site
        run: bash tools/ci_run.sh build
      - name: Test
        id: test_site
        run: bash tools/ci_run.sh test
      - name: Commit built site and accepted official updates
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage_updates() {
            git add dist
            git add data/competitions data/prediction_inputs data/updates.json
            git add data/stations.json data/schedules data/sync_meta.json data/china_auto.json
          }
          stage_updates
          if ! git diff --cached --quiet; then
            git commit -m "build: publish verified static schedule"
            # Never rebase generated JSON; rebuild against the latest trusted main.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Publish failed after three attempts"
                exit 1
              fi
              sleep $((attempt * 5))
              git fetch origin main
              git reset --hard origin/main
              bash tools/ci_run.sh all
              stage_updates
              if git diff --cached --quiet; then
                echo "Latest main already contains all accepted data; no push required"
                exit 0
              fi
              git commit -m "build: regenerate verified site against latest main"
            done
          fi

      # Success means all four fetchers, build, tests, and publish completed without unexpected failure.
      # Safe source validation refusals remain visible as warnings and never replace accepted data.
      - name: Emit successful sync heartbeat
        if: >-
          ${{ steps.sync_schedule.outcome == 'success' &&
              steps.sync_china.outcome == 'success' &&
              steps.sync_competitions.outcome == 'success' &&
              steps.sync_predictions.outcome == 'success' &&
              steps.build_site.outcome == 'success' &&
              steps.test_site.outcome == 'success' &&
              steps.publish.outcome == 'success' }}
        env:
          HEARTBEAT_SECRET: ${{ secrets.SYNC_HEARTBEAT_SECRET }}
          HEARTBEAT_URL: ${{ vars.SYNC_HEARTBEAT_URL }}
        run: |
          if [ -z "$HEARTBEAT_SECRET" ] || [ -z "$HEARTBEAT_URL" ]; then
            echo "::warning::Heartbeat not configured; API will fall back to snapshot freshness"
            echo "Heartbeat: not configured" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$HEARTBEAT_URL" in
            https://*/internal/heartbeat) ;;
            *) echo "::error::Invalid heartbeat endpoint"; exit 1;;
          esac
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            --max-time 10 --connect-timeout 5 \
            -X POST -H "Authorization: Bearer $HEARTBEAT_SECRET" \
            "$HEARTBEAT_URL" >/dev/null
          echo "Heartbeat: accepted" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail job when any synchronization crashed
        if: always()
        env:
          SCHEDULE: ${{ steps.sync_schedule.outcome }}
          CHINA: ${{ steps.sync_china.outcome }}
          COMPETITIONS: ${{ steps.sync_competitions.outcome }}
          PREDICTIONS: ${{ steps.sync_predictions.outcome }}
        run: |
          for outcome in "$SCHEDULE" "$CHINA" "$COMPETITIONS" "$PREDICTIONS"; do
            if [ "$outcome" != success ]; then
              echo "::error::Unexpected sync failure: at least one script did not complete successfully"
              exit 1
            fi
          done
      - name: Track consecutive session crashes
        if: ${{ always() && inputs.sync_decision == 'session' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_FAILED: ${{ steps.sync_schedule.outcome != 'success' ||
              steps.sync_china.outcome != 'success' ||
              steps.sync_competitions.outcome != 'success' ||
              steps.sync_predictions.outcome != 'success' }}
        run: python tools/session_incident.py
