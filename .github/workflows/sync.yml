name: Build and safely sync ISU schedule
on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ssts-wb-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests below run on the latest Node 22.x rather than the runner image's preinstalled Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
      - name: Install parser
        run: python -m pip install -r requirements.txt
      # Each sync writes only data it has fully validated; a rejected station keeps its last verified data.
      - name: Find stations' ISU pages and check their official programmes
        id: sync_schedule
        continue-on-error: true
        run: python tools/sync_schedule.py
      - name: Collect confirmed China heats from published ISU results
        id: sync_china
        continue-on-error: true
        run: python tools/sync_china.py
      - name: Sync entries, official groups, results and penalties
        id: sync_competitions
        continue-on-error: true
        run: python tools/sync_competitions.py
      - name: Sync confirmed distance entries and historical seed sources
        id: sync_predictions
        continue-on-error: true
        run: python tools/sync_predictions.py
      - name: Summarize each sync outcome
        if: always()
        env:
          SCHEDULE: ${{ steps.sync_schedule.outcome }}
          CHINA: ${{ steps.sync_china.outcome }}
          COMPETITIONS: ${{ steps.sync_competitions.outcome }}
          PREDICTIONS: ${{ steps.sync_predictions.outcome }}
        run: |
          {
            echo '## ISU sync outcomes'
            echo '| Step | Outcome |'
            echo '| --- | --- |'
            printf '| schedule | %s |\\n' "$SCHEDULE"
            printf '| china | %s |\\n' "$CHINA"
            printf '| competitions | %s |\\n' "$COMPETITIONS"
            printf '| predictions | %s |\\n' "$PREDICTIONS"
            echo 'Safe validation refusals exit 0 and appear as warnings in the step log; unexpected failures exit nonzero.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile static site
        run: python tools/build.py
      - name: Test
        run: |
          npm ci --ignore-scripts
          python -m unittest discover -s tests -v
          node --check web/app.js
          node --test tests/*.mjs
      - name: Commit built site and accepted official updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage_updates() {
            git add dist
            git add data/competitions data/prediction_inputs data/updates.json
            git add data/stations.json data/schedules data/sync_meta.json data/china_auto.json
          }
          stage_updates
          if ! git diff --cached --quiet; then
            git commit -m "build: publish verified static schedule"
            # A moved main may contain new build code or dependencies; validate the rebased output before retrying.
            for attempt in 1 2 3; do
              git push && exit 0
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 5))
              git pull --rebase origin main
              python -m pip install -r requirements.txt
              npm ci --ignore-scripts
              python tools/build.py
              python -m unittest discover -s tests -v
              node --check web/app.js
              node --test tests/*.mjs
              stage_updates
              if ! git diff --cached --quiet; then
                git commit -m "build: regenerate verified site after rebase"
              fi
            done
            exit 1
          fi
      - name: Fail job when any synchronization crashed
        if: always()
        env:
          SCHEDULE: ${{ steps.sync_schedule.outcome }}
          CHINA: ${{ steps.sync_china.outcome }}
          COMPETITIONS: ${{ steps.sync_competitions.outcome }}
          PREDICTIONS: ${{ steps.sync_predictions.outcome }}
        run: |
          for outcome in "$SCHEDULE" "$CHINA" "$COMPETITIONS" "$PREDICTIONS"; do
            if [ "$outcome" != success ]; then
              echo "::error::Unexpected sync failure: at least one script did not complete successfully"
              exit 1
            fi
          done
