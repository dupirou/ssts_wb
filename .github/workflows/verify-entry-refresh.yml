name: Verify refreshed distance entries
on:
  push:
    branches: [fix/isu-entry-generations-20261022]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Observe the existing entry stability interval
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          inputs = json.loads(Path('data/prediction_inputs/vancouver.json').read_text())
          target = max(datetime.fromisoformat(x['first_seen_at']) for x in inputs['observed_lists']) + timedelta(minutes=29, seconds=5)
          print('Recheck after', target.isoformat(), flush=True)
          while (remaining := (target - datetime.now(timezone.utc)).total_seconds()) > 0:
              time.sleep(min(30, remaining))
          PY
      - name: Independently recheck frozen historical rankings
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import sync_predictions as s
          cache = json.loads(Path('data/prediction_inputs/historic_rankings.json').read_text())['lists']
          raw = s.post_json(s.API + '/events/get-world-standings-list', dict(discipline_id=3, season_id=1, pagesize=300, page=1))
          catalog = s.discover_rankings(raw, '2025/2026', 1)
          for key, meta in catalog.items():
              current = s.ranking_rows(meta)
              saved = {int(k): v for k, v in cache[str(meta['world_standings_list_fsk_id'])].items()}
              assert current == saved, ('Historical cache changed', key)
              print('Confirmed ranking', key, len(current))
          PY
      - name: Fetch official entries and calculate projections
        run: |
          python tools/sync_predictions.py --event vancouver
          python tools/build.py
          python - <<'PY'
          import json
          from pathlib import Path
          inputs = json.loads(Path('data/prediction_inputs/vancouver.json').read_text())
          assert inputs['update_status'] == 'ok', inputs
          for item in inputs['observed_lists']:
              print(item['gender'], item['distance_m'], len(item['participants']), item['source_urls'][0])
              print('CHN:', [(p['name'], p['world_rank'], p['tour_rank'], p['prequalified']) for p in item['participants'] if p['country'] == 'CHN'])
              print('Missing:', item['missing'])
              print('Draw needed:', [(p['name'], p['country']) for p in item['participants'] if p['seed_rank'] is None])
          PY
      - run: python -m unittest discover -s tests -v
      - name: Save verified preview data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prediction_inputs dist
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified Vancouver distance entries'
            git push origin HEAD:fix/isu-entry-generations-20261022
          fi
