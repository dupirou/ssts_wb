name: Test backend interfaces
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  test:
    # Keep the browser-supported image stable when ubuntu-latest advances.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      # Same layout everywhere; run `ruff format tools tests` locally to fix.
      - run: python -m pip install ruff==0.16.9
      - run: ruff format --check tools tests
      - run: ruff check tools tests
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: bash -n tools/ci_run.sh && bash tools/ci_run.sh build
      - name: Require committed dist to match a fresh build
        run: git diff --exit-code -- dist
      - run: python -m unittest discover -s tests -v
      # Every Node test file, so a new one can never be left out of PR checks.
      - run: node --test tests/*.mjs
      - name: Check every frontend and build module
        run: for file in web/*.js tools/*.mjs dist/site.js dist/results-page.js; do node --check "$file"; done
      - name: Use preinstalled Chrome
        run: |
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Install CJK fonts for Chinese layout checks
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
      - name: Responsive layouts and offline PWA
        run: node tools/verify_results_ui.mjs
      - name: Save responsive screenshots and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-ui-verification
          path: artifacts/ui/
