# ------------------------------------------------------------------------------
# 3. WORLD TOUR 2026/27 RULES (Comm. 2806 & Qualifying Tables 2026-11-17)
# ------------------------------------------------------------------------------
world_tour:
  total_stops: 7
  event_duration_days: 3
  individual_distances: ["500m", "1000m", "1500m"]
  relay_distances:
    women: "3000m"
    men: "5000m"
    mixed: "2000m"

  entries:
    max_skaters_per_gender_total: 6
    max_skaters_per_distance_default: 3
    four_skater_exception:
      enabled: true
      max_skaters_per_distance: 4
      within_gender_total_cap: true
      condition: "member_has_at_least_3_skaters_in_world_ranking_top_40_for_distance_at_confirmed_entry"
      required_top_rank: 40
      required_skater_count: 3
    relays:
      gender_relay: { max_teams_per_gender: 1, min_skaters: 4, max_skaters: 6 }
      mixed_relay:
        max_teams: 1
        entry_list_max_per_gender: 6
        participating_min_per_gender: 2
        participating_max_per_gender: 4

  qualifying_times_500m:
    enforce_filter_in_roster_model: false
    valid_after: "2024-07-01"
    deadline_days_before_event: 10
    manual_timing_penalty_seconds: 0.2
    single_skater_member: { women: 46.37, men: 44.25 }
    multi_skater_member: { women: 45.54, men: 43.46 }

  qualifying_tables_key_limits:
    repechage_cap_1_qual_round: { "500m": 40, "1000m": 40, "1500m": 42 }
    repechage_cap_2_qual_rounds_r1_elim: { "500m": 25, "1000m": 25, "1500m": 28 }
    direct_qualifiers_to_main_session: { "500m_QF": 18, "1000m_QF": 18, "1500m_SF": 19 }
    relay_standard_advance_teams: 5

  scoring_eligibility:
    individual_requires_main_session: true
    relay_all_participating_teams_score: true
    single_skater_b_final_walkover_rank: 1

  classifications:
    individual_distance:
      points_table: "world_tour_standard_1x"
      counting_results: { best_m: 5, of_n: 7 }
      tie_breaker_order:
        - "total_counting_points"
        - "most_1st_places"
        - "most_2nd_places"
        - "most_3rd_places"
        - "most_recent_event_result"

    relay_distance:
      points_table: "world_tour_standard_1x"
      relay_multiplier: 1
      counting_results: { best_m: 5, of_n: 7 }
      tie_breaker_order:
        - "total_counting_points"
        - "most_1st_places"
        - "most_2nd_places"
        - "most_3rd_places"
        - "most_recent_event_result"

    overall_crystal_globe:
      points_table: "world_tour_standard_1x"
      counting_results: { max_individual_results: 15, max_possible_starts: 21, across_all_distances: true }
      tie_breaker_order:
        - "total_counting_points"
        - "most_1st_places"
        - "most_2nd_places"
        - "most_3rd_places"
        - "joint_winners_no_further_break"

    team_crystal_globe:
      individual_points_table: "world_tour_standard_1x"
      individual_multiplier: 1
      relay_points_table: "world_tour_team_globe_relay_3x"
      relay_multiplier: 3
      counting_results: { all_events_all_points_count: true, drop_worst: 0 }
      tie_breaker_order:
        - "total_accumulated_points"
        - "most_1st_places"
        - "most_2nd_places"
        - "most_3rd_places"
        - "joint_winners_no_further_break"

    world_ranking_rolling:
      formula: "best_(N-1)_of_N"
      season_2026_27_progression: ["3_of_4", "4_of_5", "5_of_6", "6_of_7"]
      season_2027_28_with_worlds: "7_of_8_with_worlds_2x"
      prequalification_top_k: 20
      prequalification_basis_by_stop:
        WT1: "season_2025_26_final_wt_classification"
        WT2: "season_2025_26_final_converted_100_to_1_plus_WT1"
        WT3: "WT1_plus_WT2"
        WT4: "all_2026_27_completed"
        WT5: "all_2026_27_completed"
        WT6: "all_2026_27_completed"
        WT7: "best_5_of_6_2026_27"

  race_and_event_ranking_order:
    within_race_status_order: ["FINISHED", "DNF", "PEN", "DNS"]
    unranked_bottom_order: ["RC", "FIRST_ROUND_DNS"]
    repechage_entry_eligible_statuses: ["ELIMINATED_CLEAN", "DNF"]
    repechage_entry_banned_statuses: ["PEN", "YC", "RC", "DNS"]

  cumulative_penalty_system:
    enabled: true
    countable_sanctions: ["PEN_IMPEDING", "PEN_KICKING_OUT", "YC", "RC"]
    excluded_codes: ["ASS", "EMB", "EQP", "OFF", "SR", "ST6"]
    excluded_races: ["WOMEN_RELAY", "MEN_RELAY", "MIXED_RELAY"]
    excluded_events: ["WORLD_CHAMPIONSHIPS", "EUROPEAN_CHAMPIONSHIPS", "JUNIOR_WORLD_CHAMPIONSHIPS"]
    ban_scope: "next_world_tour_event_only"
    reset_policy: "reset_to_0_after_WT7"
    thresholds:
      - sanctions: 3
        blocked_individual_distances_count: 1
        target_selection: "highest_ranked_distance"
      - sanctions: 5
        blocked_individual_distances_count: 2
        target_selection: "two_highest_ranked_distances"
      - sanctions: 7
        blocked_individual_distances_count: 3
        target_selection: "all_individual_distances"
    separate_red_card_rule_296_m:
      rolling_window_months: 12
      red_card_threshold: 2
      consequence: "automatic_suspension_all_isu_owg_yog_international_events"
      reference_min_duration_note: "verify_2026_full_clause_prior_rule_was_max(2_months,3_competitions)"

# ------------------------------------------------------------------------------
# 4. 2027 WORLD CHAMPIONSHIPS QUOTA RULES (Comm. 2805 & Rule 281.3)
# ------------------------------------------------------------------------------
world_championships_2027:
  location: "Seoul, KOR"
  dates: { start: "2027-03-12", end: "2027-03-14" }
  host_member: "KOR"

  individual_quota_calculation:
    basis: "preceding_world_championships_2026_distance_classification"
    base_quota_per_distance: 1
    two_spots_rule: { min_skaters: 1, max_rank: 32 }
    three_spots_rule: { min_skaters: 2, max_rank: 16 }
    host_exception:
      can_upgrade_to_3_per_distance: true
      counts_only_originally_qualified_for_2028_qualification: true
    special_members_comm_2804: ["BLR", "RUS"]

  relay_quota_calculation:
    basis: "world_tour_2026_27_relay_classification_best_5_of_7"
    top_n_qualified: 12
    host_replacement_rule: "if_host_unqualified_replaces_12th_ranked_team"
    forfeit_reallocation: "invite_next_ranked_member_after_WT7"
    last_qualifying_spot_tie_breaker:
      - "highest_single_event_rank_in_counting_wt_events"
      - "second_highest_single_event_rank_iterative"
      - "best_skated_time_in_counting_wt_events_2026_27"

  category_max_roster_cap_rules:
    if_gender_relay_entered: 5
    else_if_any_distance_has_3_spots: 4
    else_if_mixed_relay_qualified_or_at_least_two_distances_have_2_spots: 3
    else_if_exactly_one_distance_has_2_spots: 2
    else_default: 1

  qualifying_times_500m:
    enforce_filter_in_roster_model: false
    deadline_days_before_event: 10
    single_skater_member: { women: 46.37, men: 44.25 }
    multi_skater_member: { women: 45.54, men: 43.46 }

  china_chn_verified_status:
    individual_status: "CONFIRMED_FROM_COMM_2805_AND_2026_WORLDS_PROTOCOL"
    individual_quotas:
      women: { "500m": 3, "1000m": 3, "1500m": 2 }
      men: { "500m": 3, "1000m": 2, "1500m": 2 }
    pdf_visual_audit_note: "Verified 2026-11-21 via (x,y) coordinate extraction of Comm. 2805 p.5 and 2026 Montreal Worlds C81: Men 500m=3 (ZHANG Bohao 14th, LI Kun 16th), Men 1000m=2 (LI Kun 16th, ZHANG Bohao 20th), Men 1500m=2 (ZHANG Bohao 11th, SONG Guixu 33rd)."
    relay_status: "PENDING_UNTIL_WT7_2027_02_14"
    implied_roster_cap:
      women: { without_gender_relay: 4, with_gender_relay: 5 }
      men: { without_gender_relay: 4, with_gender_relay: 5 }

# ------------------------------------------------------------------------------
# 5. JUNIOR WORLD CUP 2026/27 & 2027 JUNIOR WORLDS (Comm. 2807 & Comm. 2805)
# ------------------------------------------------------------------------------
junior_world_cup:
  total_stops: 3
  points_table: "world_tour_standard_1x"
  relay_multiplier: 1
  relay_standard_advance_teams: 4
  relay_distances:
    women: "3000m"
    men: "3000m"
    mixed: "2000m"
  entries:
    max_skaters_per_gender_total: 5
    max_skaters_per_distance: 3
    four_skater_exception_enabled: false
    max_individual_distances_per_skater_per_stop: 2
    daily_equal_split_matrix:
      5_skaters: [[2, 3], [3, 2]]
      4_skaters: [[2, 2]]
      3_skaters: [[1, 2], [2, 1]]
      2_skaters: [[1, 1]]
    relays:
      gender_relay: { max_teams_per_gender: 1, min_skaters: 4, max_skaters: 5 }
      mixed_relay: { max_teams: 1, entry_max_per_gender: 5, participating_min_per_gender: 2, participating_max_per_gender: 4 }
  qualifying_times_500m:
    valid_after: "2024-07-01"
    deadline_days_before_event: 10
    all_skaters: { women: 49.36, men: 46.27 }
  classifications:
    has_overall_crystal_globe: false
    has_team_crystal_globe: false
    counting_results: "all_results_count"
    tie_breaker_order:
      - "total_points"
      - "most_1st_places"
      - "most_2nd_places"
      - "most_3rd_places"
      - "last_result_of_season"

junior_world_championships_2027:
  location: "Astana, KAZ"
  venue: "Alau Ice Palace"
  dates: { start: "2027-01-28", end: "2027-01-31" }
  individual_quota_basis: "preceding_junior_worlds_2026"
  base_quota_per_distance: 2
  three_spots_rule: { min_skaters: 2, max_rank: 32 }
  relay_qualification_basis: "jwc_relay_classification_after_JWC2"
  category_max_roster_cap:
    without_relay: 3
    with_relay: 5
  china_chn_individual_quotas:
    women: { "500m": 3, "1000m": 3, "1500m": 3 }
    men: { "500m": 3, "1000m": 3, "1500m": 3 }

