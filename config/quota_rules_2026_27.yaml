# ------------------------------------------------------------------------------
# 7. ROSTER OPTIMIZATION & THREE-POOL FUSION HYPERPARAMETERS (Externalized)
# ------------------------------------------------------------------------------
roster_model:
  random_seed: 202627
  monte_carlo_draws: 1000
  weight_perturbation_pct: 0.15
  enforce_500m_qualifying_time: false
  enforce_hard_locks: false
  domestic_default_divisions: ["甲组"]
  domestic_half_life_days: 180
  calibration:
    junior_rank_ridge_l2: 1.0
    junior_pace_weight_by_distance:
      "500": 0.45
      "1000": 0.35
      "1500": 0.20
    sigma_junior_adapt: 1.15
    junior_ignore_old_if_active_senior: true
    domestic_anchor_min_count: 3
    domestic_anchor_min_r: 0.25
    domestic_anchor_ridge_l2: 1.0
    domestic_anchor_prior_z: 0.0
    domestic_anchor_prior_mu: -0.35
    domestic_anchor_prior_weight: 2.5
    sigma_domestic_adapt: 1.55
    sigma_domestic_fallback: 1.75
    domestic_fallback_quantile_mu:
      top_1: 0.80
      top_3: 0.45
      top_8: 0.05
      median: -0.50
      tail: -1.15
    senior_inactivity_grace_days: 150
    senior_inactivity_mu_decay_days: 480
    relay_season_decay_weights:
      current_season: 1.0
      prev_1_season: 0.50
      prev_2_season: 0.20
      older_season: 0.08
    momentum_pool_weights:
      senior: 1.0
      junior: 0.35
      domestic: 0.25
  objective_weights:
    lambda_relay: 0.14
    lambda_form: 0.02
    lambda_fatigue: 0.045
    lambda_top40_protect: 0.04
    uncertainty_risk_aversion: 0.35
  reserve_pool:
    total_size: 6
    wt_max_size: 2
    wc_max_size: 6
    allocation:
      sprint_relay: 2
      mid_long: 2
      versatile_upside: 2
    wt_allocation:
      sprint_relay: 1
      mid_long: 1
      versatile_upside: 0
    upside_sigma_multiplier: 1.0
  injured_or_unavailable_athlete_ids:
    - "skr-4247" # 林孝埈 (未参赛/移除)
    - "skr-5859" # 任子威 (已退役)
    - "skr-1876" # 范可新 (已退役)
    - "skr-8039" # 臧一泽 (已退役)
  senior_required_domestic_venues:
    enabled: true
    venues: ["衡水"]
    applies_to_age_groups: ["SENIOR_ONLY", "UNKNOWN"]
    note: "2026/27 赛季未参加衡水站全国选拔赛的成年组运动员原则上不具备本季国际参赛资格；双适龄（DUAL_ELIGIBLE）青年选手以及在七台河站及后续国内站获单项金牌或单站总积分前三者不受此限。"
  national_team_selection_2026_27:
    enabled: true
    target_season: "2026/27"
    allow_current_season_wt_skaters: true
    allow_current_season_jwc_skaters: true
    post_hengshui_venues: ["七台河"]
    require_gold_or_station_top_n: 3
    note: "除本季 WT 现役队员与 2026/27 青杯适龄梯队外，自七台河站起仅单站单项金牌或单站总积分前三名可入选国家队候选池；候选池不足时不强行凑满替补名额。"
    preliminary_post_hengshui_stops:
      - stop_id: "pre_beijing_domestic_2026"
        target_wt_stop: "beijing"
        effective_from_date: "2026-11-30"
