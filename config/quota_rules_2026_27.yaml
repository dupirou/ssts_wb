  senior_only:
    min_age_before_cutoff: 19
    dob_max: "2007-06-30"
  junior_isu_events:
    min_age_before_cutoff: 15
    max_age_exclusive_before_cutoff: 19
    dob_min: "2007-07-01"
    dob_max: "2011-06-30"
    brackets:
      U19_Junior_A: { dob_min: "2007-07-01", dob_max: "2009-06-30" }
      U17_Junior_B: { dob_min: "2009-07-01", dob_max: "2011-06-30" }
      U15: { dob_min: "2011-07-01", dob_max: "2013-06-30" }
      U13: { dob_min: "2013-07-01", dob_max: "2015-06-30" }
  dual_eligible:
    dob_min: "2007-07-01"
    dob_max: "2009-06-30"
    jwc_1_2_cross_entry_policy: "discouraged_if_skating_fall_world_tour"
    jwc_prize_money_forfeit_trigger:
      condition: "participated_in_any_world_tour_event_before_jwc_3"
      trigger_events: ["WT1", "WT2", "WT3", "WT4", "WT5"]
      forfeits_points_or_eligibility: false
      forfeits_jwc_prize_money: true

