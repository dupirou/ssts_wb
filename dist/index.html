<script>
/* Apply the theme before first paint. Order: ?theme= link (this visit only) > manual toggle > phone/OS setting. */
(function () {
  var q = new URLSearchParams(location.search).get('theme'), t = null;
  try {
    if (q === 'light' || q === 'dark') sessionStorage.setItem('ssts.theme', q);
    t = sessionStorage.getItem('ssts.theme') || localStorage.getItem('ssts.theme');
  } catch (e) { t = q; }
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#F3F8FC' : '#0B1F33';
})();
</script>
<link rel="stylesheet" href="./site.css">
<script defer src="./app.js"></script>
</head><body>
